name: clothstock-dev


x-backend-env: &backend-env
  DEBUG: ${DEBUG}
  MYSQL_DATABASE: ${MYSQL_DATABASE}
  MYSQL_ROOT_USER: ${MYSQL_USER}
  MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
  MYSQL_HOST: "db"
  MYSQL_PORT: ${MYSQL_PORT:-3306}
  VITE_API_URL: ${VITE_API_URL}

services:
  db:
    image: mysql:8.0
    restart: always
    container_name: clothstock-dev-db
    environment:
      <<: *backend-env
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
  backend:
    build: 
      context: ./backend
      dockerfile: dockerfile.dev
    container_name: clothstock-dev-backend
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: true
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: 
      context: ./frontend
      dockerfile: dockerfile.dev
    container_name: clothstock-dev-frontend
    environment:
      <<: *backend-env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
volumes:
  mysql_data:
    name: clothstock-dev-volume